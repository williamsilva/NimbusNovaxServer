# Docker Engine 29+ rejects API versions below 1.40; the docker-java client bundled with
# Testcontainers 1.21.x defaults to the stale 1.32 when it can't auto-negotiate over the Windows
# named pipe transport, causing "client version 1.32 is too old" on this machine.
# See https://github.com/testcontainers/testcontainers-java/issues/11210
api.version=1.44
