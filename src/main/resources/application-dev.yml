spring:
  # Postgres não cria o banco pela URL - o banco "nimbusnovax" precisa existir antes do primeiro
  # boot, com a extensão PostGIS disponível (CREATE EXTENSION postgis em V1__init.sql). Defaults
  # abaixo assumem o Postgres nativo local (mesma instância usada por CardsyncServer/NimbusAuth,
  # usuário/senha postgres/postgres) - não o Postgres do docker-compose (que continua usando
  # nimbusnovax/changeme-local-only, setado explicitamente via .env para esse caminho).
  datasource:
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_DATABASE:nimbusnovax}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  security:
    oauth2:
      client:
        registration:
          nimbusnovax-bff:
            provider: nimbusnovax-as
            client-id: ${NIMBUSNOVAX_BFF_CLIENT_ID:nimbusnovax-bff}
            client-secret: ${NIMBUSNOVAX_BFF_CLIENT_SECRET:changeit-dev}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - openid
              - profile
        provider:
          nimbusnovax-as:
            # authorization-uri é enviado ao browser (redirect) - precisa ser o issuer público
            # (localhost). token/jwk-set/user-info são chamados pelo backend em si - usam
            # NIMBUS_AUTH_INTERNAL_BASE_URL, que diverge do issuer quando o backend roda
            # containerizado (docker compose) e o NimbusAuth roda nativamente no host (ver
            # comentário de NIMBUS_AUTH_INTERNAL_BASE_URL no .env.example).
            authorization-uri: ${nimbusnovax.security.issuer}/oauth2/authorize
            token-uri: ${NIMBUS_AUTH_INTERNAL_BASE_URL:http://localhost:9090}/oauth2/token
            jwk-set-uri: ${NIMBUS_AUTH_INTERNAL_BASE_URL:http://localhost:9090}/oauth2/jwks
            user-info-uri: ${NIMBUS_AUTH_INTERNAL_BASE_URL:http://localhost:9090}/userinfo
            user-name-attribute: sub

server:
  # 9093, não 9092 - evita colidir com o backend do NimbusFlow (projeto de origem desta cópia,
  # que continua usando 9092 por padrão) quando os dois rodam lado a lado na mesma máquina.
  port: ${SERVER_PORT:9093}
  servlet:
    session:
      cookie:
        http-only: true
        secure: false # dev; em prod true
        same-site: LAX

nimbusnovax:
  security:
    # Issuer do NimbusAuth (real, rodando localmente fora do docker-compose - nem o NimbusAuth
    # nem o Cardsync são dockerizados nesta workspace).
    issuer: ${NIMBUS_AUTH_ISSUER:http://localhost:9090}

    cookies:
      domain: ${NIMBUSNOVAX_COOKIE_DOMAIN:}
      secure: ${NIMBUSNOVAX_COOKIE_SECURE:false}
      same-site: ${NIMBUSNOVAX_COOKIE_SAMESITE:Lax}

    resource-server:
      enabled: true
      jwk-set-uri: ${NIMBUS_AUTH_INTERNAL_BASE_URL:http://localhost:9090}/oauth2/jwks

    web:
      spa-base-url: ${NIMBUSNOVAX_SPA_BASE_URL:http://localhost:4203}
      allowed-origins:
        - ${CORS_ALLOWED_ORIGINS:http://localhost:4203}

  nimbusauth:
    # Mesma base do jwk-set-uri acima (nimbusnovax.security.resource-server.jwk-set-uri), exposta
    # separadamente pra ser reaproveitada nas chamadas REST de perfil/senha
    # (com.nimbusnovax.common.security.NimbusAuthClient).
    base-url: ${NIMBUS_AUTH_INTERNAL_BASE_URL:http://localhost:9090}
    # Mesmo secret compartilhado já configurado no NimbusAuth e no CardsyncServer - protege
    # /internal/users (com.nimbusnovax.common.security.NimbusAuthInternalClient/UserDirectoryService).
    internal-api-secret: ${NIMBUS_INTERNAL_API_SECRET:dev-internal-secret-change-me}

  # com.nimbusnovax.common.notification.mail.EmailProperties - fake por default (só loga, sem
  # credencial nenhuma necessária em dev).
  email:
    impl: ${NIMBUSNOVAX_EMAIL_IMPL:fake}
    from-name: ${NIMBUSNOVAX_EMAIL_FROM_NAME:NimbusNovax}
    from-email: ${NIMBUSNOVAX_EMAIL_FROM_EMAIL:naoresponda@nimbussystems.com.br}
    # Base pública DESTE backend (não a de produção!) - usada só pra montar a URL absoluta da logo
    # da empresa (ver EmailProperties.publicBaseUrl/CompanySettingsService). Diferente do
    # publicBaseUrl fixo do NimbusAuth/CardsyncServer (aponta sempre pra produção lá, pois é uma
    # logo fixa/idêntica nos dois ambientes) - aqui a logo é dinâmica (vem do banco de CADA
    # ambiente), então apontar pra produção em dev mostraria a logo errada (ou nenhuma).
    public-base-url: ${NIMBUSNOVAX_API_PUBLIC_BASE_URL:http://localhost:${SERVER_PORT:9093}}
    brevo:
      base-url: ${BREVO_BASE_URL:https://api.brevo.com/v3}
      api-key: ${BREVO_API_KEY:}
