<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body style="margin:0; padding:0; background-color:#eef1f6; font-family: Helvetica, Arial, sans-serif;">

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#eef1f6;">
  <tr>
    <td align="center" style="padding: 24px 12px;">

      <table role="presentation" width="640" cellpadding="0" cellspacing="0" border="0"
             style="background-color:#ffffff; border-radius:12px; overflow:hidden; border:1px solid #e2e8f0;">

        <!-- Header -->
        <tr>
          <td style="background-color:#16a34a; padding:22px 28px;">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td th:if="${company.logoUrl}" style="padding-right:12px; vertical-align:middle;">
                  <img th:src="${company.logoUrl}" alt="Logo" width="44" height="44"
                       style="display:block; max-width:44px; max-height:44px; border-radius:6px;" />
                </td>
                <td style="vertical-align:middle;">
                  <div style="color:#ffffff; font-size:20px; font-weight:bold;">Obrigado pela sua visita!</div>
                  <div style="color:#dcfce7; font-size:13px; margin-top:2px;" th:text="${company.name ?: 'NimbusNovax'}">Empresa</div>
                </td>
              </tr>
            </table>
          </td>
        </tr>

        <!-- Greeting -->
        <tr>
          <td style="padding:24px 28px 6px 28px;">
            <p style="margin:0 0 14px 0; font-size:15px; color:#111827;">
              Olá, <b th:text="${voucher.client.name}">Cliente</b>!
            </p>
            <div style="font-size:13px; line-height:1.6; color:#374151; white-space:pre-line;" th:text="${emailBody}">
              Corpo da notificação de troca de voucher.
            </div>
          </td>
        </tr>

        <!-- Voucher info card -->
        <tr>
          <td style="padding:8px 28px 0 28px;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
                   style="background-color:#f8fafc; border:1px solid #e2e8f0; border-radius:10px;">
              <tr>
                <td style="padding:14px 18px; width:50%; vertical-align:top;">
                  <div style="font-size:9px; text-transform:uppercase; letter-spacing:.03em; color:#94a3b8;">Voucher</div>
                  <div style="font-size:13px; font-weight:bold; color:#111827;" th:text="${voucher.code}">CODE</div>
                </td>
                <td style="padding:14px 18px; width:50%; vertical-align:top; border-left:1px solid #e2e8f0;">
                  <div style="font-size:9px; text-transform:uppercase; letter-spacing:.03em; color:#94a3b8;">Data da Visita</div>
                  <div style="font-size:13px; font-weight:bold; color:#111827;"
                       th:text="${#temporals.format(voucher.visitDate, 'dd/MM/yyyy')}">dd/mm/aaaa</div>
                </td>
              </tr>
            </table>
          </td>
        </tr>

        <!-- Footer -->
        <tr>
          <td style="padding:26px 28px 24px 28px;">
            <p style="margin:0; font-size:12px; color:#4b5563;">Esperamos vê-lo(a) novamente em breve!</p>
          </td>
        </tr>
        <tr>
          <td style="background-color:#f8fafc; border-top:1px solid #e2e8f0; padding:16px 28px; text-align:center;">
            <div style="font-size:12px; font-weight:bold; color:#334155;" th:text="${company.name ?: 'NimbusNovax'}">Empresa</div>
            <div style="font-size:11px; color:#94a3b8; margin-top:2px;" th:if="${company.phone}" th:text="'Telefone: ' + ${company.phone}">Telefone</div>
          </td>
        </tr>

      </table>
    </td>
  </tr>
</table>

</body>
</html>
