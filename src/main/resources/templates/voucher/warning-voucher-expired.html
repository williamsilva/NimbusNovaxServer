<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body style="margin:0; padding:0; background-color:#eef1f6; font-family: Helvetica, Arial, sans-serif;">

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#eef1f6;">
  <tr>
    <td align="center" style="padding: 24px 12px;">

      <table role="presentation" width="640" cellpadding="0" cellspacing="0" border="0"
             style="background-color:#ffffff; border-radius:12px; overflow:hidden; border:1px solid #e2e8f0;">

        <!-- Header -->
        <tr>
          <td style="background-color:#d97706; padding:22px 28px;">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td th:if="${company.logoUrl}" style="padding-right:12px; vertical-align:middle;">
                  <img th:src="${company.logoUrl}" alt="Logo" width="44" height="44"
                       style="display:block; max-width:44px; max-height:44px; border-radius:6px;" />
                </td>
                <td style="vertical-align:middle;">
                  <div style="color:#ffffff; font-size:20px; font-weight:bold;">⚠ Vouchers vencidos</div>
                  <div style="color:#fef3c7; font-size:13px; margin-top:2px;" th:text="${company.name ?: 'NimbusNovax'}">Empresa</div>
                </td>
              </tr>
            </table>
          </td>
        </tr>

        <!-- Intro -->
        <tr>
          <td style="padding:24px 28px 6px 28px;">
            <p style="margin:0; font-size:14px; color:#111827;">
              <span th:text="${vouchers.size()}">0</span>
              <span th:text="${vouchers.size() == 1} ? 'voucher está vencido' : 'vouchers estão vencidos'">voucher(s) vencido(s)</span>
              e precisa(m) de atenção.
            </p>
          </td>
        </tr>

        <!-- Tabela -->
        <tr>
          <td style="padding:16px 28px 0 28px;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="border:1px solid #e2e8f0;">
              <tr style="background-color:#fffbeb;">
                <td style="padding:8px 10px; font-size:10px; color:#92400e; font-weight:bold; text-transform:uppercase;">Voucher</td>
                <td style="padding:8px 10px; font-size:10px; color:#92400e; font-weight:bold; text-transform:uppercase;">Cliente</td>
                <td style="padding:8px 10px; font-size:10px; color:#92400e; font-weight:bold; text-transform:uppercase;">Promotor</td>
                <td style="padding:8px 10px; font-size:10px; color:#92400e; font-weight:bold; text-transform:uppercase;">Visita</td>
                <td align="right" style="padding:8px 10px; font-size:10px; color:#92400e; font-weight:bold; text-transform:uppercase;">Atraso</td>
              </tr>
              <tr th:each="voucher : ${vouchers}">
                <td style="padding:8px 10px; font-size:12px; color:#111827; border-top:1px solid #e2e8f0;" th:text="${voucher.code}">CODE</td>
                <td style="padding:8px 10px; font-size:12px; color:#111827; border-top:1px solid #e2e8f0;" th:text="${voucher.clientName}">Cliente</td>
                <td style="padding:8px 10px; font-size:12px; color:#111827; border-top:1px solid #e2e8f0;" th:text="${voucher.promoterName}">Promotor</td>
                <td style="padding:8px 10px; font-size:12px; color:#111827; border-top:1px solid #e2e8f0;"
                    th:text="${#temporals.format(voucher.visitDate, 'dd/MM/yyyy')}">dd/mm/aaaa</td>
                <td align="right" style="padding:8px 10px; font-size:12px; color:#b45309; font-weight:bold; border-top:1px solid #e2e8f0;"
                    th:text="${voucher.daysOverdue} + ' dia(s)'">0 dia(s)</td>
              </tr>
            </table>
          </td>
        </tr>

        <!-- Footer -->
        <tr>
          <td style="padding:22px 28px 24px 28px;">
            <p style="margin:0; font-size:12px; color:#4b5563;">
              Entre em contato com o cliente para confirmar, remarcar ou cancelar a visita.
            </p>
          </td>
        </tr>
        <tr>
          <td style="background-color:#f8fafc; border-top:1px solid #e2e8f0; padding:16px 28px; text-align:center;">
            <div style="font-size:12px; font-weight:bold; color:#334155;" th:text="${company.name ?: 'NimbusNovax'}">Empresa</div>
          </td>
        </tr>

      </table>
    </td>
  </tr>
</table>

</body>
</html>
